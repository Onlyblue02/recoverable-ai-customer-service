[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "recoverable-ai-customer-service"
version = "1.0.0rc3"
description = "Recoverable AI customer service engineering baseline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langgraph>=0.6,<2",
  "langgraph-checkpoint-postgres>=2,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.9,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "jsonschema>=4.25,<5",
  "mypy>=1.16,<2",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/customer_service", "src/mock_business"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
